<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">
  <rect width="595" height="842" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="594" height="841" fill="none" stroke="#cccccc"/>
  <text x="560" y="40" text-anchor="end" font-size="10" fill="#888">様式第1号</text>
  <text x="297" y="78" text-anchor="middle" font-size="20" letter-spacing="3" fill="#111">貨物軽自動車運送事業経営届出書</text>

  <text x="560" y="120" text-anchor="end" font-size="13" fill="#1d4ed8" font-weight="bold" text-decoration="underline">令和8年6月1日</text>

  <text x="40" y="160" font-size="14" fill="#111"><tspan fill="#1d4ed8" font-weight="bold" text-decoration="underline">東京</tspan> 運輸支局長　殿</text>

  <rect x="320" y="180" width="235" height="86" fill="none" stroke="#bbb"/>
  <text x="332" y="200" font-size="12" fill="#333">届出者</text>
  <text x="332" y="222" font-size="12" fill="#333">住所　<tspan fill="#1d4ed8" font-weight="bold">東京都渋谷区渋谷1-2-3 渋谷ハイツ101</tspan></text>
  <text x="332" y="246" font-size="12" fill="#333">氏名　<tspan fill="#1d4ed8" font-weight="bold">山田 太郎</tspan>　　　㊞</text>

  <text x="40" y="300" font-size="12" fill="#222">貨物軽自動車運送事業を経営しようとするので、貨物自動車運送事業法</text>
  <text x="40" y="318" font-size="12" fill="#222">第36条第1項の規定により、下記のとおり届け出ます。</text>

  <!-- table -->
  <g stroke="#666" stroke-width="1">
    <rect x="40" y="345" width="515" height="240" fill="none"/>
    <line x1="40" y1="393" x2="555" y2="393"/>
    <line x1="40" y1="441" x2="555" y2="441"/>
    <line x1="40" y1="489" x2="555" y2="489"/>
    <line x1="40" y1="537" x2="555" y2="537"/>
    <line x1="210" y1="345" x2="210" y2="585"/>
  </g>
  <g font-size="12" fill="#333">
    <rect x="40" y="345" width="170" height="240" fill="#f5f5f5"/>
    <text x="50" y="374">氏名又は名称</text>
    <text x="50" y="422">営業所の名称・位置</text>
    <text x="50" y="470">自動車の種別・数</text>
    <text x="50" y="518">車庫の位置・収容能力</text>
    <text x="50" y="566">事業の開始予定日</text>
  </g>
  <g font-size="12" fill="#1d4ed8" font-weight="bold">
    <text x="222" y="374">山田 太郎</text>
    <text x="222" y="416">山田運送</text>
    <text x="222" y="432">東京都渋谷区渋谷1-2-3</text>
    <text x="222" y="470">軽自動車（貨物）　1両</text>
    <text x="222" y="518">東京都渋谷区渋谷1-2-3／1両</text>
    <text x="222" y="566">令和8年6月15日</text>
  </g>

  <rect x="40" y="605" width="515" height="34" fill="#eef4ff" stroke="#bcd0f7"/>
  <text x="52" y="626" font-size="12" fill="#1d4ed8">☑ 標準貨物軽自動車運送約款を使用する</text>

  <text x="297" y="690" text-anchor="middle" font-size="10" fill="#999">※ 青字・下線部分がフォーム入力から自動記入される箇所です</text>
  <text x="297" y="800" text-anchor="middle" font-size="9" fill="#bbb">黒ナンバー書類自動生成アプリ — 記入見本（サンプル: 山田太郎/東京）</text>
</svg>
