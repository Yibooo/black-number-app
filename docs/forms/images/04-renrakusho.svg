  <text x="52" y="212" font-size="12" fill="#333">住　　所　：<tspan fill="#1d4ed8" font-weight="bold">東京都渋谷区渋谷1-2-3 渋谷ハイツ101</tspan></text>
  <text x="52" y="232" font-size="12" fill="#333">使用の本拠：<tspan fill="#1d4ed8" font-weight="bold">東京都渋谷区渋谷1-2-3</tspan></text>

  <!-- vehicle table -->
  <g stroke="#666" stroke-width="1">
    <rect x="40" y="260" width="515" height="70" fill="none"/>
    <line x1="40" y1="290" x2="555" y2="290"/>
    <line x1="170" y1="260" x2="170" y2="330"/>
    <line x1="300" y1="260" x2="300" y2="330"/>
    <line x1="400" y1="260" x2="400" y2="330"/>
    <line x1="470" y1="260" x2="470" y2="330"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
