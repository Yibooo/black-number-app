  <text x="555" y="120" text-anchor="end" font-size="13" fill="#333">番号：<tspan fill="#aaa">（運輸支局記入）</tspan></text>

  <!-- jigyosha info -->
  <rect x="40" y="145" width="515" height="92" fill="none" stroke="#bbb"/>
