  <!-- uketsuke in -->
  <rect x="400" y="365" width="155" height="90" fill="none" stroke="#888"/>
  <text x="477" y="388" text-anchor="middle" font-size="11" fill="#777">運輸支局　受付印</text>
  <circle cx="477" cy="423" r="22" fill="none" stroke="#e3b7b7" stroke-dasharray="3 3"/>

  <rect x="40" y="490" width="515" height="58" fill="#eef9ee" stroke="#bcdcbc"/>
  <text x="52" y="512" font-size="11" fill="#2f6b2f">① 運輸支局で受付印（確認印）をもらう → ② その連絡書を軽自動車検査</text>
